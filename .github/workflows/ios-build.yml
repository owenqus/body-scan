name: Build iOS Body Scan

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/**'
      - '.github/workflows/ios-build.yml'
  push:
    paths:
      - 'ios/**'
      - 'tests/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  geometry-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the actual measurement engine and run analytic fixtures
        run: |
          swiftc ios/BodyScan/ScanModels.swift ios/BodyScan/ScanGeometry.swift ios/BodyScan/BodyAnalysisEngine.swift tests/main.swift -o /tmp/body-scan-regression
          /tmp/body-scan-regression
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ios/BodyScan.xcodeproj -scheme BodyScan

      - name: Build for generic iPhone
        run: >-
          xcodebuild
          -project ios/BodyScan.xcodeproj
          -scheme BodyScan
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
