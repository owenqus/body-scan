name: Build iOS Body Scan

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ios/BodyScan.xcodeproj -scheme BodyScan

      - name: Build for generic iPhone
        run: >-
          xcodebuild
          -project ios/BodyScan.xcodeproj
          -scheme BodyScan
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build